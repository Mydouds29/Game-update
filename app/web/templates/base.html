<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111315">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}Game Update{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
<link rel="stylesheet" href="{{ url_for('feed.tags_css') }}">
<link rel="manifest" href="{{ url_for('feed.manifest') }}">
<link rel="icon" href="{{ url_for('static', filename='icons/icon.svg') }}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
<script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body>
<div class="shell">
{% block header %}{% endblock %}
<main id="main">
{% block content %}{% endblock %}
</main>
{% if nav %}
<nav class="tabbar" aria-label="Navigation principale">
  {% from "_macros.html" import icon %}
  <a class="tabbar__brand brand" href="{{ url_for('feed.index') }}">{{ icon('logo') }}<span>GAME UPDATE</span></a>
  <a href="{{ url_for('feed.index') }}" {% if nav == 'feed' %}aria-current="page"{% endif %}>{{ icon('feed') }}Fil</a>
  <a href="{{ url_for('games.index') }}" {% if nav == 'games' %}aria-current="page"{% endif %}>{{ icon('games') }}Jeux</a>
  <a href="{{ url_for('games.settings') }}" {% if nav == 'settings' %}aria-current="page"{% endif %}>{{ icon('settings') }}Réglages</a>
</nav>
{% endif %}
</div>
</body>
</html>
