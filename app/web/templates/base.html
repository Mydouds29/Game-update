<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111315">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}Game Update{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="{{ static_url('app.css') }}">
<link rel="stylesheet" href="{{ url_for('feed.tags_css') }}">
<link rel="manifest" href="{{ url_for('feed.manifest') }}">
<link rel="icon" href="{{ static_url('icons/icon.svg') }}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ static_url('icons/icon-192.png') }}">
<script src="{{ static_url('app.js') }}" defer></script>
</head>
<body>
<div class="shell">
{% block header %}{% endblock %}
<main id="main">
{% block content %}{% endblock %}
</main>
</div>
</body>
</html>
