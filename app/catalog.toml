# Catalogue curaté des jeux couverts. Appliqué avec `flask --app wsgi sync-catalog`.
#
# Frédéric décide de chaque jeu et de sa source avant tout ajout ici.
#
# Choix de la source, dans cet ordre :
#   1. flux RSS/Atom officiel de l'éditeur (type "rss") : prévu pour être repris,
#      le plus stable. Le chercher avec `flask --app wsgi discover-feeds <url du site>`.
#   2. annonces Steam de l'éditeur (type "steam") : contenu officiel, API autorisée,
#      mais dépendance à Valve.
#   3. page du site officiel (types "blizzard" / "html") : seulement à défaut,
#      après lecture des conditions d'utilisation du site.
#   Les hotfixes publiés uniquement sur un forum officiel Discourse passent par
#   le type "discourse" (sujets du staff seulement).
#
# Format d'une entrée (voir tests/fixtures/catalog_test.toml pour des exemples) :
#
# [[games]]
# slug = "mon-jeu"              # minuscules, chiffres et tirets
# name = "Nom complet du jeu"
# short_name = "Nom court"      # affiché sur l'étiquette du jeu
# tag_color = "#RRGGBB"
#
#   [[games.sources]]
#   key = "mon-jeu-steam"       # identifiant stable de la source
#   type = "rss"                # rss | steam | blizzard | html | discourse
#   label = "Flux officiel"
#   enabled = true
#   fetch_interval = 1800       # secondes, minimum 300
#   params = { url = "https://editeur.example/news/rss" }
#   # steam : params = { appid = 123456 }, à vérifier avec `verify-sources`
#
# - L'état actif/inactif d'un jeu n'est fixé qu'à sa création : ensuite c'est
#   le bouton « Suivi » de l'appli qui décide (notifications).
# - Un jeu ou une source retiré de ce fichier est désactivé, jamais supprimé.

[[games]]
slug = "diablo-4"
name = "Diablo IV"
short_name = "Diablo IV"
tag_color = "#F29B94"

  # Gros patchs : page officielle, une version par bloc repliable.
  # Vérifiée le 2026-09-27 (3.2.2 lu en entier, robots.txt respecté).
  [[games.sources]]
  key = "diablo-4-blizzard"
  type = "blizzard"
  label = "Blizzard News"
  fetch_interval = 3600
  params = { mode = "anchored_page", url = "https://news.blizzard.com/en-us/article/24295395/diablo-iv-patch-notes" }

  # Hotfixes : publiés seulement sur le forum officiel, dans des sujets du staff
  # (« HOTFIX 4 - September 22, 2026 - 3.2.1 »). Vérifié le 2026-09-27.
  [[games.sources]]
  key = "diablo-4-forum"
  type = "discourse"
  label = "Forum Blizzard"
  fetch_interval = 3600
  params = { forum_url = "https://us.forums.blizzard.com/en/d4", category = "pc-general-discussion/5" }

[[games]]
slug = "diablo-2-resurrected"
name = "Diablo II: Resurrected"
short_name = "D2R"
tag_color = "#E0B35C"

  # Patchs et hotfixes : sujets du staff dans General Discussion, non épinglés
  # (« Patch 3.2.0.2 – July 16, 2026 », « HOTFIX 1 - April 2, 2026 - 3.1.2 »).
  # 5 pages ≈ 2 semaines d'activité du forum. Vérifié le 2026-09-27.
  [[games.sources]]
  key = "diablo-2-resurrected-forum"
  type = "discourse"
  label = "Forum Blizzard"
  fetch_interval = 3600
  params = { forum_url = "https://us.forums.blizzard.com/en/d2r", category = "general-discussion/6", pages = 5 }

[[games]]
slug = "heroes-of-the-storm"
name = "Heroes of the Storm"
short_name = "HotS"
tag_color = "#7FA7F2"

  # « Live Patch Notes », « Balance Patch Notes », hotfixes : sujets du staff
  # dans General Discussion (les « PTR Patch Notes » sont écartés).
  # 5 pages ≈ 2 semaines d'activité du forum. Vérifié le 2026-09-27.
  [[games.sources]]
  key = "heroes-of-the-storm-forum"
  type = "discourse"
  label = "Forum Blizzard"
  fetch_interval = 3600
  params = { forum_url = "https://us.forums.blizzard.com/en/heroes", category = "general-discussion/6", pages = 5 }

