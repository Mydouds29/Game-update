[[games]]
slug = "wuthering-waves"
name = "Wuthering Waves"
short_name = "Wuthering Waves"
tag_color = "#9FD68C"

  [[games.sources]]
  # Source à investiguer : le site officiel est rendu en JavaScript ; il faut
  # identifier l'API JSON de news qu'il appelle (onglet Réseau du navigateur)
  # puis renseigner les champs ci-dessous et passer enabled à true.
  key = "wuthering-waves-site"
  type = "html"
  label = "Site officiel"
  enabled = false
  fetch_interval = 3600
  params = { mode = "json_list", list_url = "https://wutheringwaves.kurogames.com/en/main/news/", items_path = "data.list", id_field = "id", title_field = "title", date_field = "publishTime", url_template = "https://wutheringwaves.kurogames.com/en/main/news/detail/{id}", max_articles = 5 }
