# Catalogue de TEST uniquement : jeux et sources d'exemple utilisés par pytest.
# Ce ne sont pas des jeux choisis pour l'application (voir app/catalog.toml).

[[games]]
slug = "diablo-4"
name = "Diablo IV"
short_name = "Diablo IV"
tag_color = "#F29B94"

  [[games.sources]]
  key = "diablo-4-blizzard"
  type = "blizzard"
  label = "Blizzard News"
  fetch_interval = 3600
  # À VÉRIFIER : URL reprise de la maquette ; Blizzard change parfois l'ID
  # d'article de la page de patch notes au lancement d'une extension.
  params = { mode = "anchored_page", url = "https://news.blizzard.com/en-us/article/24295395/diablo-iv-patch-notes" }

  [[games.sources]]
  # Doublon possible avec la page Blizzard : désactivé par défaut. La
  # déduplication par hash de contenu évite les doublons stricts.
  key = "diablo-4-steam"
  type = "steam"
  label = "Steam"
  enabled = false
  fetch_interval = 1800
  params = { appid = 2344520 }

